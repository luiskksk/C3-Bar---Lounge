<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | C3 Bar & Lounge</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header">

        <a href="../index.html" class="logo-link" aria-label="Página inicial do C3">
            <img
                src="../assets/imgs/Logos/logo-c3.png"
                alt="C3 Bar & Lounge"
                class="logo"
            >
        </a>

        <input
            type="checkbox"
            id="menu-toggle"
            class="menu-toggle"
        >

        <label
            for="menu-toggle"
            class="menu-icon"
            aria-label="Abrir menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav class="nav">
            <a href="../index.html">Início</a>
            <a href="./sobre.html">Sobre</a>
            <a href="./cardapio.html">Cardápio</a>
            <a href="./produtos.html">Produtos</a>
            <a href="./contato.html">Contato</a>
            <a href="./pages/reservas.html">Reservas</a>
        </nav>

        <a href="./login.html" class="btn-login">
            Entrar
        </a>

    </header>


    <main class="login-page">

        <section class="login-container">

            <div class="login-visual">

                <div class="login-glow"></div>

                <div class="login-orbita login-orbita-1"></div>
                <div class="login-orbita login-orbita-2"></div>

                <img
                    src="../assets/imgs/Logos/logo-c3.png"
                    alt="C3 Bar & Lounge"
                    class="login-logo"
                >

            </div>


            <div class="login-box">

                <p class="tag">
                    ÁREA C3
                </p>

                <h1>
                    BEM-VINDO
                    <span>DE VOLTA.</span>
                </h1>

                <p class="login-descricao">
                    Entre na sua conta para continuar sua experiência
                    no universo C3.
                </p>


                <form id="form-login" class="login-form">

                    <div class="login-campo">

                        <label for="login-email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="seuemail@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="login-campo">

                        <label for="login-senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="login-senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <button type="submit" class="login-btn">
                        Entrar
                    </button>

                </form>


                <div class="login-divisor">
                    <span></span>
                    <p>OU</p>
                    <span></span>
                </div>


                <button
                    id="login-google"
                    type="button"
                    class="login-google"
                >
                    <span class="google-g">G</span>

                    Continuar com Google
                </button>


                <p
                    id="login-mensagem"
                    class="login-mensagem"
                    aria-live="polite"
                ></p>


                <p class="login-cadastro">
                    Ainda não possui uma conta?

                    <a href="./cadastro.html">
                        Criar conta
                    </a>
                </p>

            </div>

        </section>

    </main>


    <!-- JS EXTERNO -->
    <script type="module" src="../js/script.js"></script>
<script type="module" src="../js/login.js"></script>

</body>

</html>
